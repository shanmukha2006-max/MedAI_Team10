seed: 42

hardware:
  mixed_precision: fp16
  grad_accum_steps: 2
  num_workers: 4

data:
  img_size: 224
  batch_size: 4
  cxr:
    path: data/processed/mimic
  seg:
    path: data/processed/msd

model:
  backbone: vit_base_patch16_384
  heads:
    classify: {num_labels: 14}
    segment:  {out_channels: 2}
    report:   {max_len: 64}

loss:
  classify_bce: 1.0
  segment_dice: 1.0
  report_ce: 0.2

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.05
  epochs: 6

self_train:
  enable: true
  pct_unlabeled: 0.5
  confidence_threshold: 0.9
  max_iters: 2
